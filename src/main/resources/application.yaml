spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/guestpass
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true            # выводить SQL-запросы в консоль
    properties:
      hibernate:
        format_sql: true      # форматировать SQL для читаемости
        dialect: org.hibernate.dialect.PostgreSQLDialect
